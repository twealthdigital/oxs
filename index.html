<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>OXs</title>
</head>
<body>
  <header class="header">
    <a class="logo" href="#" aria-label="OXs">OXs</a>
    <nav class="nav">
      <a href="#">Product</a>
      <a href="#">Specs</a>
      <a href="#">Reviews</a>
      <a href="#">Support</a>
    </nav>
    <a class="btn btn--blue" href="#">Buy now</a>
  </header>

  <main class="hero" id="hero">
    <svg class="air" viewBox="0 0 1200 800" preserveAspectRatio="none" aria-hidden="true">
      <path d="M-50 220 C 200 120, 380 320, 640 220 S 1000 140, 1250 240" />
      <path d="M-50 400 C 220 300, 420 500, 700 380 S 1020 320, 1250 420" />
      <path d="M-50 580 C 180 500, 400 660, 660 560 S 1000 500, 1250 600" />
    </svg>
    <div class="hero__tint"></div>
    <canvas id="fan-canvas" aria-hidden="true"></canvas>
    <div class="streaks" id="streaks"></div>

    <div class="hero__content">
      <div class="col col--left">
        <h1 class="headline" aria-label="Blow everything away.">
          <span class="line" data-wind data-split>Blow</span>
          <span class="line line--blue" data-wind data-split>everything</span>
          <span class="line" data-wind data-split>away.</span>
        </h1>
        <p class="lede" data-wind>The fan that gets the whole room moving. Pick a speed and feel the page react.</p>
        <div class="cta">
          <a class="btn btn--blue" data-wind href="#">Shop OXs</a>
          <a class="btn btn--ghost" data-wind href="#">See specs</a>
        </div>
      </div>

      <div class="col col--right">
        <div class="card" data-wind><b>3 speeds</b><span>Breeze, wind, storm</span></div>
        <div class="card" data-wind><b>Low noise</b><span>Loud look, quiet motor</span></div>
      </div>
    </div>

    <div class="speed" role="group" aria-label="Fan speed">
      <span class="speed__label">Speed</span>
      <button class="key" data-level="0" aria-pressed="true"><i class="led"></i><b>OFF</b></button>
      <button class="key" data-level="1" aria-pressed="false"><i class="led"></i><b>1</b></button>
      <button class="key" data-level="2" aria-pressed="false"><i class="led"></i><b>2</b></button>
      <button class="key" data-level="3" aria-pressed="false"><i class="led"></i><b>3</b></button>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
