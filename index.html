<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <script>try{var t=localStorage.getItem('oxs-theme');if(t==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>OXs</title>
</head>
<body>
  <header class="header">
    <a class="logo" href="#" aria-label="OXs">OXs</a>
    <nav class="nav" aria-label="Main">
      <i class="nav__pill" aria-hidden="true"></i>
      <a href="#" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg><span>Product</span></a>
      <a href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Specs</span></a>
      <a href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg><span>Reviews</span></a>
      <a href="#"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Support</span></a>
    </nav>
    <a class="btn btn--blue" href="#"><span>Buy now</span></a>
  </header>

  <main class="hero" id="hero">
    <svg class="air" viewBox="0 0 1200 800" preserveAspectRatio="none" aria-hidden="true">
      <path d="M-50 220 C 200 120, 380 320, 640 220 S 1000 140, 1250 240" />
      <path d="M-50 400 C 220 300, 420 500, 700 380 S 1020 320, 1250 420" />
      <path d="M-50 580 C 180 500, 400 660, 660 560 S 1000 500, 1250 600" />
    </svg>
    <div class="hero__tint"></div>
    <canvas id="fan-canvas" aria-hidden="true"></canvas>
    <div class="streaks" id="streaks"></div>

    <div class="hero__content">
      <div class="col col--left">
        <h1 class="headline" aria-label="Cool air, for every room.">
          <span class="line" data-wind data-split>Cool air,</span>
          <span class="line line--blue" data-wind data-split>for every</span>
          <span class="line" data-wind data-split>room.</span>
        </h1>
        <p class="lede" data-wind>Stand, desk and tower fans with quiet motors and three real speeds, delivered to your door.</p>
        <div class="cta">
          <a class="btn btn--blue" data-wind href="#"><span>Shop fans</span></a>
          <a class="btn btn--ghost" data-wind href="#"><span>Compare models</span></a>
        </div>
      </div>

      <div class="col col--right">
        <div class="stat" data-wind><b class="num"><span data-count="48">0</span><i>k+</i></b><span class="stat__label">Fans delivered</span></div>
        <div class="stat" data-wind><b class="num"><span data-count="4.9" data-dec="1">0</span><i>/5</i></b><span class="stat__label">Average rating</span></div>
        <div class="stat" data-wind><b class="num"><span data-count="24">0</span><i>h</i></b><span class="stat__label">Dispatch time</span></div>
      </div>
    </div>

    <button class="theme" id="theme" role="switch" aria-checked="false" aria-label="Dark mode">
      <span class="theme__bg theme__bg--sun"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
      <span class="theme__bg theme__bg--moon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg></span>
      <span class="theme__thumb"><span class="theme__i theme__i--sun"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><span class="theme__i theme__i--moon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg></span></span>
    </button>

    <div class="knob" id="knob-wrap" data-level="0">
      <svg class="knob__ring" viewBox="0 0 200 200" aria-hidden="true">
        <defs><path id="ring" d="M100,100 m-84,0 a84,84 0 1,1 168,0 a84,84 0 1,1 -168,0" /></defs>
        <text><textPath href="#ring" textLength="522" lengthAdjust="spacing">CONTROL • CONTROL • CONTROL • CONTROL •</textPath></text>
      </svg>
      <span class="knob__lbl" style="--a:-135deg" data-l="0">OFF</span>
      <span class="knob__lbl" style="--a:-45deg" data-l="1">1</span>
      <span class="knob__lbl" style="--a:45deg" data-l="2">2</span>
      <span class="knob__lbl" style="--a:135deg" data-l="3">3</span>
      <button class="knob__btn" id="knob" aria-label="Fan speed: off. Press to change.">
        <span class="knob__cap" id="knob-cap"><i class="knob__mark"></i></span>
      </button>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
